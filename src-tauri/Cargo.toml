[package]
name = "pimu-note"
version = "0.1.0"
description = "Markdown で書いて、Markdown のままコピーできるメモアプリ"
authors = ["株式会社Pimu"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pimu_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"

# グローバルショートカットはデスクトップ専用
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
